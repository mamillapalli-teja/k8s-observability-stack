# Helm value overrides for Prometheus (kube-prometheus-stack)
prometheus:
  prometheusSpec:
    retention: 15d
    scrapeInterval: 30s
    # Discover all ServiceMonitors across namespaces, not just labeled ones
    serviceMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
